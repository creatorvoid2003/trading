name: Build Android APK
# Run from the GitHub site/app: Actions tab > Build Android APK > Run workflow.
# Needs no Expo account. The APK appears under "Artifacts" when the run finishes.
on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_AGENT_URL: ${{ secrets.EXPO_PUBLIC_AGENT_URL }}
      EXPO_PUBLIC_AGENT_TOKEN: ${{ secrets.EXPO_PUBLIC_AGENT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx expo install --fix   # aligns package versions with the Expo SDK
      - run: npx expo prebuild --platform android --no-install
      - run: ./gradlew assembleRelease --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: trading-zones-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 14
